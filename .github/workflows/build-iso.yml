name: OBSIDIAN Linux ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', 'obsidian/**', 'tools/**', '.github/workflows/build-iso.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Debian live-build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates
      - name: Stage OBSIDIAN files
        run: bash scripts/stage.sh
      - name: Build ISO
        run: bash scripts/build-iso.sh
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-os-amd64-iso
          path: |
            out/obsidian-os-amd64.iso
            out/SHA256SUMS
          retention-days: 7
