name: ISO boot smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools qemu-system-x86
      - name: Stage sources
        run: bash scripts/stage.sh
      - name: Build ISO
        run: sudo bash scripts/build-iso.sh
      - name: Attempt QEMU boot
        run: bash scripts/smoke-test-iso.sh
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-qemu-diagnostics
          path: out/qemu-serial.log
          if-no-files-found: ignore
